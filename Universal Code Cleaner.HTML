<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Code Cleaner</title>
<style>
:root {
    --bg-app: #1e1e1e;
    --bg-panel: #252526;
    --bg-header: #2d2d2d;
    --bg-titlebar: #252526;
    --bg-input: #1e1e1e;
    --border-color: #3c3c3c;
    --border-soft: #383838;
    --text-main: #d4d4d4;
    --text-muted: #8b8b8b;
    --text-dim: #6a6a6a;
    --accent: #569cd6;
    --accent-hover: #6fb1e8;
    --accent-soft: rgba(86, 156, 214, 0.12);
    --success: #4ec9b0;
    --success-hover: #6fded0;
    --danger: #f44747;
    --danger-hover: #ff6464;
    --warning: #d7ba7d;
    --warning-bg: #2d2a1f;
    --warning-border: #5a4a23;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace;
    --ui-font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --radius: 6px;
    --shadow-soft: 0 4px 18px rgba(0, 0, 0, 0.35);
    --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    font-family: var(--ui-font);
    background: var(--bg-app);
    color: var(--text-main);
    margin: 0;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 100vh;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-header);
    padding: 14px 22px;
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-soft);
    flex-wrap: wrap;
    gap: 12px;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--success));
    box-shadow: 0 0 12px rgba(86, 156, 214, 0.5);
    flex-shrink: 0;
}

.header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.3px;
}

.header .subtitle {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
}

.badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 60%;
}

.badge {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(86, 156, 214, 0.25);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--mono);
    letter-spacing: 0.4px;
    transition: var(--transition);
    animation: fadeIn 0.25s ease;
}

.badge.placeholder {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-dim);
    border-color: var(--border-color);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}

.workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    flex-grow: 1;
    min-height: 44vh;
}

.panel {
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    transition: border-color var(--transition), box-shadow var(--transition);
}

.panel:focus-within {
    border-color: rgba(86, 156, 214, 0.45);
    box-shadow: var(--shadow-soft), 0 0 0 3px rgba(86, 156, 214, 0.08);
}

.panel-header {
    background: var(--bg-titlebar);
    padding: 11px 18px;
    border-bottom: 1px solid var(--border-color);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

.panel-header .label {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
}

.dot-red { background: #f44747; }
.dot-yellow { background: #d7ba7d; }
.dot-green { background: #4ec9b0; }

.traffic-lights {
    display: flex;
    gap: 6px;
}

textarea {
    flex-grow: 1;
    border: none;
    padding: 18px 20px;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.65;
    resize: none;
    background: var(--bg-input);
    color: #ce9178;
    outline: none;
    tab-size: 4;
    white-space: pre;
    min-height: 320px;
    transition: background var(--transition);
}

#inputCode {
    color: #9cdcfe;
}

#outputCode {
    color: #b5cea8;
}

textarea::placeholder {
    color: var(--text-dim);
    font-style: italic;
}

textarea::-webkit-scrollbar {
    width: 12px;
    height: 12px;
}

textarea::-webkit-scrollbar-track {
    background: var(--bg-input);
}

textarea::-webkit-scrollbar-thumb {
    background: #424242;
    border-radius: 6px;
    border: 3px solid var(--bg-input);
}

textarea::-webkit-scrollbar-thumb:hover {
    background: #565656;
}

.btn {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-main);
    border: 1px solid var(--border-soft);
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    transition: background var(--transition), border-color var(--transition), transform var(--transition), color var(--transition);
    font-family: var(--ui-font);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: #565656;
    color: #ffffff;
}

.btn:active {
    transform: scale(0.97);
}

.btn:disabled {
    opacity: 0.5;
    cursor: default;
    transform: none;
}

.btn-action {
    background: linear-gradient(135deg, #2f7d6f, var(--success));
    color: #0c1f1a;
    border: 1px solid var(--success);
}

.btn-action:hover {
    background: linear-gradient(135deg, #35907f, var(--success-hover));
    color: #06140f;
    box-shadow: 0 2px 12px rgba(78, 201, 176, 0.3);
}

.btn-primary {
    background: linear-gradient(135deg, #3a7bb5, var(--accent));
    color: #0b1b28;
    border: 1px solid var(--accent);
}

.btn-primary:hover {
    background: linear-gradient(135deg, #4789c5, var(--accent-hover));
    color: #071420;
    box-shadow: 0 2px 12px rgba(86, 156, 214, 0.3);
}

.btn-danger {
    background: rgba(244, 71, 71, 0.1);
    color: var(--danger);
    border: 1px solid rgba(244, 71, 71, 0.3);
    font-size: 11px;
    padding: 6px 12px;
    flex-shrink: 0;
}

.btn-danger:hover {
    background: rgba(244, 71, 71, 0.18);
    border-color: var(--danger);
    color: var(--danger-hover);
}

.btn-clear-all {
    font-size: 11.5px;
}

.quarantine-panel {
    background: var(--warning-bg);
    border-radius: var(--radius);
    border: 1px solid var(--warning-border);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.35s ease;
    margin-top: 0;
}

.quarantine-panel.visible {
    max-height: 320px;
    opacity: 1;
}

.quarantine-inner {
    padding: 18px 22px;
    overflow-y: auto;
    max-height: 320px;
}

.quarantine-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
}

.quarantine-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    color: var(--warning);
    font-size: 14px;
    font-weight: 700;
}

.quarantine-title .icon {
    font-size: 16px;
}

.quarantine-count {
    background: rgba(215, 186, 125, 0.18);
    color: var(--warning);
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 12px;
    font-family: var(--mono);
    font-weight: 700;
}

.q-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.q-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: rgba(0, 0, 0, 0.18);
    padding: 12px 14px;
    border: 1px solid rgba(215, 186, 125, 0.18);
    border-radius: var(--radius);
    gap: 16px;
    animation: fadeIn 0.25s ease;
    transition: border-color var(--transition), background var(--transition);
}

.q-item:hover {
    border-color: rgba(215, 186, 125, 0.4);
    background: rgba(0, 0, 0, 0.28);
}

.q-text {
    font-family: var(--mono);
    color: #e8d6ae;
    font-size: 12.5px;
    word-break: break-all;
    white-space: pre-wrap;
    line-height: 1.5;
}

.q-empty {
    color: var(--text-dim);
    font-size: 13px;
    font-style: italic;
}

.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--accent);
    color: #0b1b28;
    border-radius: var(--radius);
    padding: 7px 18px;
    font-size: 12px;
    font-family: var(--mono);
    font-weight: 600;
    box-shadow: var(--shadow-soft);
}

.status-bar .right {
    display: flex;
    gap: 18px;
    opacity: 0.85;
}

@media (max-width: 880px) {
    .workspace {
        grid-template-columns: 1fr;
    }
    .badges {
        max-width: 100%;
        justify-content: flex-start;
    }
    .header {
        flex-direction: column;
        align-items: flex-start;
    }
}

@media (prefers-reduced-motion: reduce) {
    * {
        animation: none !important;
        transition: none !important;
    }
}

button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}
</style>
</head>
<body>
<header class="header">
    <div class="header-title">
        <span class="logo-dot"></span>
        <div>
            <h1>Universal Code Cleaner</h1>
            <p class="subtitle">strip comments &middot; preserve logic &middot; zero breakage</p>
        </div>
    </div>
    <div class="badges" id="langBadges">
        <span class="badge placeholder">Linguagens: aguardando código...</span>
    </div>
</header>

<div class="workspace">
    <div class="panel">
        <div class="panel-header">
            <span class="label">
                <span class="traffic-lights">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                </span>
                Código Original
            </span>
            <button class="btn btn-action" id="cleanBtn">▶ Limpar Código</button>
        </div>
        <textarea id="inputCode" spellcheck="false" placeholder="Cole seu código sujo aqui e clique em &quot;Limpar Código&quot;..."></textarea>
    </div>

    <div class="panel">
        <div class="panel-header">
            <span class="label">
                <span class="traffic-lights">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                </span>
                Código Limpo
            </span>
            <button class="btn btn-primary" id="copyBtn">Copiar Código</button>
        </div>
        <textarea id="outputCode" spellcheck="false" readonly placeholder="O resultado aparecerá aqui..."></textarea>
    </div>
</div>

<div class="quarantine-panel" id="quarantineSection">
    <div class="quarantine-inner">
        <div class="quarantine-header">
            <h3 class="quarantine-title">
                <span class="icon">⚠</span>
                Revisão Inteligente
                <span class="quarantine-count" id="quarantineCount">0</span>
            </h3>
            <button class="btn btn-danger btn-clear-all" id="clearAllBtn">Limpar Tudo</button>
        </div>
        <div class="q-list" id="quarantineList">
            <span class="q-empty">O código está limpo. Nenhum alerta pendente.</span>
        </div>
    </div>
</div>

<div class="status-bar">
    <span id="statusMain">Pronto</span>
    <span class="right">
        <span id="statusChars">0 caracteres</span>
        <span id="statusLines">0 linhas</span>
    </span>
</div>

<script>
(function () {
    var blacklistedComments = new Set();
    var currentQuarantineState = [];

    var SUSPICIOUS_REGEX = /(https?:\/\/|www\.|\b(?:\d{1,3}\.){3}\d{1,3}\b|\.com\b|\.br\b|\.net\b|\.org\b|\.io\b)/i;

    function generateHash(str) {
        var hash = 0;
        for (var i = 0; i < str.length; i++) {
            hash = (Math.imul(31, hash) + str.charCodeAt(i)) | 0;
        }
        return "id_" + Math.abs(hash);
    }

    function detectLanguages(code) {
        var found = [];
        if (!code) return found;

        if (code.indexOf("<?php") !== -1) found.push("PHP");

        if (/(<html[\s>]|<!DOCTYPE|<\/div>|<body[\s>]|<head[\s>])/i.test(code)) found.push("HTML");

        if (/<style[\s>]/i.test(code) || /[.#][\w-]+\s*\{[^}]*:[^}]*\}/.test(code)) {
            found.push("CSS");
        }

        if (/<script[\s>]/i.test(code)) {
            found.push("JavaScript");
        } else if (/\b(function|const|let|=>|document\.|console\.)\b/.test(code) && found.indexOf("HTML") === -1) {
            found.push("JavaScript / C-Family");
        }

        if (/--\[\[/.test(code) && /\blocal\b/.test(code)) found.push("Lua");

        if (/(\bdef\s+\w+\s*\(|"""|'''|\bself\b)/.test(code) && found.indexOf("JavaScript / C-Family") === -1 && found.indexOf("JavaScript") === -1) {
            found.push("Python");
        }

        if (/\b(SELECT|INSERT INTO|UPDATE\s+\w+\s+SET|DELETE FROM|CREATE TABLE)\b/i.test(code)) found.push("SQL");

        if (found.length === 0) {
            if (/\b(function|const|let|var|class|public|private|static|void|int|return)\b/.test(code)) {
                found.push("JavaScript / C-Family");
            } else {
                found.push("Texto puro");
            }
        }

        var unique = [];
        found.forEach(function (lang) {
            if (unique.indexOf(lang) === -1) unique.push(lang);
        });
        return unique;
    }

    function runLexer(code) {
        var result = "";
        var i = 0;
        var len = code.length;
        currentQuarantineState = [];

        var inString = false;
        var stringChar = "";

        var inHtmlComment = false;
        var inBlockComment = false;
        var inLuaBlockComment = false;
        var inTripleQuote = false;
        var tripleQuoteChar = "";

        var commentStart = -1;

        var MAX_ITER = len * 4 + 1000;
        var iterCount = 0;

        while (i < len) {
            iterCount++;
            if (iterCount > MAX_ITER) {
                return "ERRO: limite de iterações excedido. Verifique o código de entrada.";
            }

            var c = code[i];
            var c2 = code.substr(i, 2);
            var c3 = code.substr(i, 3);
            var c4 = code.substr(i, 4);

            if (inString) {
                if (c === "\\") {
                    result += c;
                    i++;
                    if (i < len) {
                        result += code[i];
                        i++;
                    }
                    continue;
                }
                if (c === stringChar) {
                    inString = false;
                }
                result += c;
                i++;
                continue;
            }

            if (inHtmlComment) {
                if (c3 === "-->") {
                    inHtmlComment = false;
                    i += 3;
                    var fullComment = code.substring(commentStart, i);
                    handleComment(fullComment, function (text) { result += text; });
                    continue;
                }
                i++;
                continue;
            }

            if (inBlockComment) {
                if (c2 === "*/") {
                    inBlockComment = false;
                    i += 2;
                    var fullComment2 = code.substring(commentStart, i);
                    handleComment(fullComment2, function (text) { result += text; });
                    continue;
                }
                i++;
                continue;
            }

            if (inLuaBlockComment) {
                if (c2 === "]]") {
                    inLuaBlockComment = false;
                    i += 2;
                    var fullComment3 = code.substring(commentStart, i);
                    handleComment(fullComment3, function (text) { result += text; });
                    continue;
                }
                i++;
                continue;
            }

            if (inTripleQuote) {
                if (c3 === tripleQuoteChar) {
                    inTripleQuote = false;
                    i += 3;
                    var fullComment4 = code.substring(commentStart, i);
                    handleComment(fullComment4, function (text) { result += text; });
                    continue;
                }
                i++;
                if (i >= len) {
                    var fullComment5 = code.substring(commentStart, len);
                    handleComment(fullComment5, function (text) { result += text; });
                }
                continue;
            }

            if (c === '"' || c === "'" || c === "`") {
                inString = true;
                stringChar = c;
                result += c;
                i++;
                continue;
            }

            if (c4 === "<!--") {
                inHtmlComment = true;
                commentStart = i;
                i += 4;
                continue;
            }

            if (c2 === "/*") {
                inBlockComment = true;
                commentStart = i;
                i += 2;
                continue;
            }

            if (c4 === "--[[") {
                inLuaBlockComment = true;
                commentStart = i;
                i += 4;
                continue;
            }

            if (c3 === '"""' || c3 === "'''") {
                inTripleQuote = true;
                tripleQuoteChar = c3;
                commentStart = i;
                i += 3;
                continue;
            }

            if (c2 === "//" || c2 === "--") {
                var end = code.indexOf("\n", i);
                if (end === -1) end = len;
                var lineComment = code.substring(i, end);
                handleComment(lineComment, function (text) { result += text; });
                i = end;
                continue;
            }

            if (c === "#") {
                var endHash = code.indexOf("\n", i);
                if (endHash === -1) endHash = len;
                var hashComment = code.substring(i, endHash);
                handleComment(hashComment, function (text) { result += text; });
                i = endHash;
                continue;
            }

            result += c;
            i++;
        }

        if (inHtmlComment || inBlockComment || inLuaBlockComment || inTripleQuote) {
            if (commentStart >= 0) {
                var remaining = code.substring(commentStart, len);
                handleComment(remaining, function (text) { result += text; });
            }
        }

        return result
            .replace(/[ \t]+$/gm, "")
            .replace(/\n{3,}/g, "\n\n")
            .replace(/^\s+|\s+$/g, "");
    }

    function handleComment(commentText, appendFn) {
        if (SUSPICIOUS_REGEX.test(commentText)) {
            var hashId = generateHash(commentText);
            if (!blacklistedComments.has(hashId)) {
                currentQuarantineState.push({ id: hashId, text: commentText });
                appendFn(commentText);
            }
        }
    }

    function renderLangBadges(langs) {
        var container = document.getElementById("langBadges");
        container.innerHTML = "";

        if (!langs || langs.length === 0) {
            var placeholder = document.createElement("span");
            placeholder.className = "badge placeholder";
            placeholder.innerText = "Linguagens: aguardando código...";
            container.appendChild(placeholder);
            return;
        }

        var label = document.createElement("span");
        label.className = "badge placeholder";
        label.innerText = "Linguagens:";
        container.appendChild(label);

        langs.forEach(function (lang) {
            var b = document.createElement("span");
            b.className = "badge";
            b.innerText = lang;
            container.appendChild(b);
        });
    }

    function updateStatusBar(text) {
        var lines = text ? text.split("\n").length : 0;
        var chars = text ? text.length : 0;
        document.getElementById("statusChars").innerText = chars.toLocaleString("pt-BR") + " caracteres";
        document.getElementById("statusLines").innerText = lines.toLocaleString("pt-BR") + " linhas";
    }

    function processEngine() {
        var inputEl = document.getElementById("inputCode");
        var outputEl = document.getElementById("outputCode");
        var btn = document.getElementById("cleanBtn");
        var input = inputEl.value;
        var statusMain = document.getElementById("statusMain");

        if (!input || !input.trim()) {
            outputEl.value = "Nenhum código para limpar.";
            currentQuarantineState = [];
            renderQuarantine();
            renderLangBadges([]);
            updateStatusBar("");
            statusMain.innerText = "Pronto";
            return;
        }

        var originalText = btn.innerText;
        btn.innerText = "Processando...";
        btn.disabled = true;
        statusMain.innerText = "Processando...";

        setTimeout(function () {
            try {
                renderLangBadges(detectLanguages(input));
                var cleaned = runLexer(input);
                outputEl.value = cleaned;
                renderQuarantine();
                updateStatusBar(cleaned);
                statusMain.innerText = "Limpeza concluída";
            } catch (error) {
                outputEl.value = "ERRO NO MOTOR: " + error.message;
                statusMain.innerText = "Erro durante o processamento";
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }, 30);
    }

    function renderQuarantine() {
        var section = document.getElementById("quarantineSection");
        var container = document.getElementById("quarantineList");
        var countBadge = document.getElementById("quarantineCount");
        container.innerHTML = "";

        countBadge.innerText = currentQuarantineState.length;

        if (currentQuarantineState.length === 0) {
            var span = document.createElement("span");
            span.className = "q-empty";
            span.innerText = "O código está limpo. Nenhum alerta pendente.";
            container.appendChild(span);
            section.classList.remove("visible");
            return;
        }

        section.classList.add("visible");

        currentQuarantineState.forEach(function (item) {
            var div = document.createElement("div");
            div.className = "q-item";

            var textSpan = document.createElement("span");
            textSpan.className = "q-text";
            textSpan.innerText = item.text.length > 200 ? item.text.substring(0, 200) + "..." : item.text;

            var btn = document.createElement("button");
            btn.className = "btn btn-danger";
            btn.innerText = "Remover";
            btn.addEventListener("click", function () {
                rejectComment(item.id);
            });

            div.appendChild(textSpan);
            div.appendChild(btn);
            container.appendChild(div);
        });
    }

    function rejectComment(hashId) {
        blacklistedComments.add(hashId);
        processEngine();
    }

    function clearAllQuarantine() {
        currentQuarantineState.forEach(function (item) {
            blacklistedComments.add(item.id);
        });
        processEngine();
    }

    function copyCode() {
        var outputEl = document.getElementById("outputCode");
        if (!outputEl.value || outputEl.value === "Nenhum código para limpar.") return;

        var copyBtn = document.getElementById("copyBtn");
        var originalText = copyBtn.innerText;

        function showCopied() {
            copyBtn.innerText = "Copiado!";
            copyBtn.classList.add("btn-action");
            copyBtn.classList.remove("btn-primary");
            setTimeout(function () {
                copyBtn.innerText = originalText;
                copyBtn.classList.remove("btn-action");
                copyBtn.classList.add("btn-primary");
            }, 1800);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(outputEl.value).then(showCopied, function () {
                fallbackCopy(outputEl, showCopied);
            });
        } else {
            fallbackCopy(outputEl, showCopied);
        }
    }

    function fallbackCopy(outputEl, callback) {
        outputEl.removeAttribute("readonly");
        outputEl.select();
        try {
            document.execCommand("copy");
        } catch (e) {}
        outputEl.setAttribute("readonly", "readonly");
        window.getSelection().removeAllRanges();
        callback();
    }

    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("cleanBtn").addEventListener("click", processEngine);
        document.getElementById("copyBtn").addEventListener("click", copyCode);
        document.getElementById("clearAllBtn").addEventListener("click", clearAllQuarantine);
        document.getElementById("inputCode").addEventListener("input", function (e) {
            updateStatusBar(e.target.value);
        });
    });
})();
</script>
</body>
</html>
